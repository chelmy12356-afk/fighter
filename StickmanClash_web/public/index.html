<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Clash — Web</title><link rel="stylesheet" href="style.css"></head>
<body><main><canvas id="game" width="1280" height="720"></canvas><div id="overlay" class="overlay"><h1>STICKMAN CLASH</h1><p>WEB EDITION</p><button id="cpu">1 — VS CPU</button><button id="local">2 — LOCAL 2 PLAYER</button><div class="online"><button id="host">3 — CREATE ONLINE ROOM</button><button id="join">4 — JOIN ONLINE ROOM</button><input id="room" maxlength="6" placeholder="ROOM CODE" autocomplete="off"><div id="status"></div></div><small>A/D + F/G + W + Space &nbsp; | &nbsp; Player 2: Arrows + K/L + I</small></div><div id="hud" class="hud hidden"><div class="bar p1"><span>PLAYER 1</span><div><i id="hp1"></i></div></div><div class="timer" id="timer">60</div><div class="bar p2"><span>PLAYER 2</span><div><i id="hp2"></i></div></div></div><div id="message" class="message hidden"></div></main><script src="game.js"></script></body></html>
